<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../assets/main.css">
    <link rel="stylesheet" href="../assets/terms.css">
</head>
<body>
    <div class="wrapper">
        <div class="headerBox">
            <p class="title">Terms of Use.</p>
            <p class="desc">These terms apply to your access to and use of the Droply application.</p>
            <p class="desc">Effective Date: September 14, 2026</p>
        </div>
        <div class="list-box">
            <p class="title">IN THIS DOCUMENT</p>
            <div class="lists"></div>
        </div>
        <div class="legal-wrapper"></div>
        <div class="details">
            <p class="title">Operator Details</p>
            <p class="label"><span>Details:</span> GigaX Inc</p>
            <p class="label"><span>Owner:</span> Himanshu Sharma</p>
            <p class="label"><span>Country:</span> India</p>
        </div>
    </div>
</body>
<script src="../assets/data/termsData.js"></script>
<script>

    let listBox = document.querySelector('.lists')
    let legalBox = document.querySelector('.legal-wrapper')
    
    function createSlug(text) {
        return text
            .toLowerCase()
            .trim()
            .replace(/[^a-z0-9 -]/g, '')
            .replace(/\s+/g, '-') 
            .replace(/-+/g, '-');
        }

    if(listBox && legalBox){
        listBox.innerHTML = LIST_DATA.map((item,i)=>{
            const titleID = createSlug(item)
            return `<a href="#${titleID}" class="list-capsule"><p class="list">${i + 1}. ${item}</p></a>`    
        }).join('')
    
        legalBox.innerHTML = TERMS_DATA.map((item,i)=>{
            const titleID = createSlug(item.title)
            return `
                <div id="${titleID}">
                    <p class="legal-title">${i+1}. ${item.title}</p>
                    <div class="para-wrapper">
                        ${item.para?.map(innerItem => 
                            `<p class="legal-desc">${innerItem}</p>`
                        ).join('') || ''}
                    </div>
                    <div class="points ml-2.5 my-2">
                        ${item.points?.map(innerPoint =>
                            `<p>- ${innerPoint}</p>`
                        ).join('') || ''}
                    </div>
                </div>
            `
        }).join('')

    }
</script>
</html>
